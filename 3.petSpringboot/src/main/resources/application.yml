server:
  port: ${SERVER_PORT:8080}
# 默认INFO输出业务日志；路径相对于应用启动工作目录。
logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    com.nuanzhua.pet: ${LOG_LEVEL:INFO}
spring:
  config:
    import: optional:file:./application-ai-local.properties
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: nuanzhua-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pet_demo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
app:
  media-root: ${MEDIA_ROOT:uploads}
  amap:
    base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
    web-key: ${AMAP_WEB_KEY:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo-enabled: ${DEMO_ENABLED:false}
  # 首次启动自动创建超级管理员admin；可用环境变量覆盖初始密码。
  bootstrap-password: ${BOOTSTRAP_PASSWORD:admin123456}
  token-hours: ${TOKEN_HOURS:12}
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8090}
    api-key: ${AI_SERVICE_API_KEY:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    local-cache-scope: STATEMENT
  global-config:
    db-config:
      id-type: auto
