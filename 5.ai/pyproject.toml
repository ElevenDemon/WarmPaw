[project]
name = "nuanzhua-ai"
version = "0.1.0"
description = "AI agent service for the Nuanzhua pet care platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<2.0",
    "PyYAML>=6.0,<7.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

